$WALLPAPERS_DIR = ~/Pictures/wallpapers/tokyonight-wallpapers
$WP_TIMEOUT = 60
$SCALING = 1.67
$MONITOR1 = DP-2
$MONITOR2 = HDMI-A-1

# exec-once = elephant
# exec-once = walker --gapplication-service
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
# exec-once = anyrun daemon &
exec-once = pypr
# Starts swaybg with a random wallpaper per monitor
exec-once = ~/.config/hypr/scripts/random-wallpaper.sh
exec-once = swaync
exec-once = qs -c widgets -n -d
# exec-once = swww-daemon
exec = ~/.config/com.ml4w.hyprlandsettings/hyprctl.sh
# exec-once = sh -c "while true; do find $wallpapers -type f \( -name '*.jpg' -o -name '*.jpeg' -o -name '*.png' \) | shuf -n 1 | xargs swww img --transition-type random; sleep $WP_TIMEOUT; done" 
# exec-once = nm-applet --indicator
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = gsettings set org.gnome.desktop.interface gtk-theme "Tokyonight-Dark"
exec-once = gsettings set org.gnome.desktop.interface icon-theme "Tokyonight-Dark"
exec-once = gsettings set org.gnome.desktop.interface color-scheme "prefer-dark"
exec-once = ~/.config/hypr/scripts/bars.sh

env = NVD_BACKEND,direct
env = WLR_NO_HARDWARE_CURSORS,1
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = GBM_BACKEND,nvidia-drm
env = LIBVA_DRIVER_NAME,nvidia
env = __VK_LAYER_NV_optimus,NVIDIA_only
env = WLR_RENDERER,vulkan

env = QT_QPA_PLATFORMTHEME,qt6ct
env = GDK_SCALE,1
env = HYPRCURSOR_SIZE,24

input {
    kb_layout = us,ua
    kb_options = grp:alt_shift_toggle
    follow_mouse = 1
  
    touchpad {
        natural_scroll = true
        scroll_factor = 0.4
    }
    sensitivity = -0.5
}

general {
    gaps_in = 2
    gaps_out = 6
    border_size = 1
    col.active_border = rgba(7aa2f7ee) rgba(bb9af7ee) 45deg
    col.inactive_border = rgba(414868aa)
    layout = dwindle
}

decoration {
    rounding = 5
    blur {
        enabled = true
        size = 5
        passes = 2
    }
}

animations {
    enabled = yes
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

dwindle {
    # pseudotile = true  # removed in Hyprland 0.56
    preserve_split = true
}

$mainMod = SUPER

windowrule = float on, match:class ^(rofi-left)$
windowrule = pin on, match:class ^(rofi-left)$

windowrule = float on, match:class ^(rofi-right)$
# windowrule = move (monitor_w-320) (30), match:class ^(rofi-right)$
windowrule = pin on, match:class ^(rofi-right)$
# windowrule = animation slide, match:class ^(rofi-right)$

windowrule = float on, match:class ^(tui-popup)$
windowrule = size 65% 65%, match:class ^(tui-popup)$
windowrule = center on, match:class ^(tui-popup)$

# bind = $mainMod SHIFT, W, exec, find $WALLPAPERS_DIR -type f | shuf -n 1 | xargs swww img --transition-type random

# bind = $mainMod, SPACE, exec, walker

# bind = $mainMod, R, exec, walker --modules runner
# bind = $mainMod SHIFT, F, exec, walker --modules finder

# bind = $mainMod, SPACE, exec, anyrun 

# bind = $mainMod SHIFT, V, exec, cliphist list | anyrun --plugins libstdin.so | cliphist decode | wl-copy

# bind = $mainMod, R, exec, anyrun --str ":"

# bind = $mainMod, K, exec, anyrun --str "="

# bind = $mainMod, F, exec, anyrun --str "~/"

# bind = $mainMod, W, exec, anyrun --str "?"

bind = SUPER, SPACE, exec, rofi -show drun
bind = SUPER, R, exec, rofi -show run
bind = SUPER, F, exec, rofi -show filebrowser
bind = SUPER, V, exec, ~/.config/rofi/clipboard.sh
bind = SUPER, U, exec, ~/.config/rofi/web-search.sh
bind = SUPER, W, exec, rofi -show window

bind = $mainMod, S, exec, pypr toggle spotify

bind = $mainMod SHIFT, W, exec, qs -c widgets ipc call widgets toggle network

bind = $mainMod SHIFT, A, exec, qs -c widgets ipc call widgets toggle audio

bind = $mainMod SHIFT, B, exec, qs -c widgets ipc call widgets toggle bluetooth

bind = $mainMod, ESCAPE, exec, kitty --class tui-popup -e btop
bind = $mainMod, E, exec, kitty --class tui-popup -e yazi

bind = $mainMod, Q, exec, kitty
bind = $mainMod, C, killactive,
# bind = $mainMod, M, exit, 
bind = $mainMod SHIFT, V, togglefloating, 
bind = $mainMod CTRL, W, exec, ~/.config/hypr/scripts/random-wallpaper.sh

bind = $mainMod, P, pseudo, 
bind = $mainMod SHIFT, N, layoutmsg, togglesplit
bind = $mainMod, I, exec, wdisplays

bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

bind = $mainMod, right, resizeactive, 10 0
bind = $mainMod, left, resizeactive, -10 0
bind = $mainMod, up, resizeactive, 0 -10
bind = $mainMod, down, resizeactive, 0 10

binde = $mainMod, right, resizeactive, 10 0
binde = $mainMod, left, resizeactive, -10 0
binde = $mainMod, up, resizeactive, 0 -10
binde = $mainMod, down, resizeactive, 0 10

bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

bind = $mainMod SHIFT, M, exec, ~/.local/bin/rofi-power-menu
bind = $mainMod SHIFT, L, exec, hyprlock 
bind = $mainMod SHIFT, R, exec, ~/.config/hypr/scripts/wf-recorder-toggle.sh

workspace = 1, monitor:$MONITOR1, default:true
workspace = 2, monitor:$MONITOR1
workspace = 3, monitor:$MONITOR1
workspace = 4, monitor:$MONITOR1
workspace = 5, monitor:$MONITOR1

workspace = 6, monitor:$MONITOR2, default:true
workspace = 7, monitor:$MONITOR2
workspace = 8, monitor:$MONITOR2
workspace = 9, monitor:$MONITOR2
workspace = 10, monitor:$MONITOR2

bind = $mainMod, 1, focusmonitor, $MONITOR1
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, focusmonitor, $MONITOR1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, focusmonitor, $MONITOR1
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, focusmonitor, $MONITOR1
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, focusmonitor, $MONITOR1
bind = $mainMod, 5, workspace, 5

bind = $mainMod, 6, focusmonitor, $MONITOR2
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, focusmonitor, $MONITOR2
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, focusmonitor, $MONITOR2
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, focusmonitor, $MONITOR2
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, focusmonitor, $MONITOR2
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 1, focusmonitor, $MONITOR1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 2, focusmonitor, $MONITOR1
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 3, focusmonitor, $MONITOR1
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 4, focusmonitor, $MONITOR1
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 5, focusmonitor, $MONITOR1

bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 6, focusmonitor, $MONITOR2
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 7, focusmonitor, $MONITOR2
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 8, focusmonitor, $MONITOR2
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 9, focusmonitor, $MONITOR2
bind = $mainMod SHIFT, 0, movetoworkspace, 10
bind = $mainMod SHIFT, 0, focusmonitor, $MONITOR2


bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, ALT_L, resizewindow

bind = , Print, exec, grim -g "$(slurp)" - | wl-copy

bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+ --limit 1.0
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%- --limit 1.0
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-

# monitor = eDP-1, 2560x1600@60, 0x0, 1
#
monitor=$MONITOR1,2560x1440@143.86,1153x0,$SCALING
monitor=$MONITOR2,1920x1080@60,0x340,$SCALING

# Waybar control keybinds
bind = $mainMod ALT, B, exec, ~/.config/hypr/scripts/toggle-bars.sh  # Toggle freeze state
