# hypridle: what happens when you're away.
# Paused automatically while anything fullscreen is open (see hyprland.lua) or
# an app inhibits idle (video players, browsers playing video, games).

general {
    lock_cmd = pidof hyprlock || hyprlock          # one lock screen only
    before_sleep_cmd = loginctl lock-session        # lock before suspend
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
    ignore_dbus_inhibit = false
}

# 5 min: dim the screen (laptops; brightnessctl finds no backlight on the desktop)
listener {
    timeout = 300
    on-timeout = brightnessctl -s set 30%
    on-resume = brightnessctl -r
}

# 10 min: lock
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# 15 min: screens off
listener {
    timeout = 900
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# 30 min: suspend, but only on battery (laptops)
listener {
    timeout = 1800
    on-timeout = ~/.config/hypr/scripts/suspend-on-battery.sh
}
