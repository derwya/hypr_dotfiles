# hyprlock: Tokyo Night lock screen (SUPER+SHIFT+L, or after 10 min idle).
# Check without locking:  hyprlock -c <this file> --display none
# (prints config errors, then exits because the display doesn't exist)

general {
    hide_cursor = true
    ignore_empty_input = true
}

# Blurred, darkened snapshot of whatever was on screen
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    brightness = 0.55
    contrast = 0.9
    vibrancy = 0.2
    noise = 0.012
}

# Clock
label {
    monitor =
    text = $TIME
    color = rgba(c0caf5ff)
    font_size = 110
    font_family = JetBrainsMono Nerd Font ExtraBold
    shadow_passes = 2
    shadow_size = 4
    position = 0, 220
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgba(a9b1d6ff)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    shadow_passes = 2
    position = 0, 105
    halign = center
    valign = center
}

# Greeting
label {
    monitor =
    text = Hi, $USER
    color = rgba(bb9af7ff)
    font_size = 15
    font_family = JetBrainsMono Nerd Font
    position = 0, 30
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 56
    rounding = 14
    outline_thickness = 2
    outer_color = rgba(7aa2f7ff) rgba(bb9af7ff) 45deg
    inner_color = rgba(1a1b26cc)
    font_color = rgba(c0caf5ff)
    font_family = JetBrainsMono Nerd Font
    check_color = rgba(7dcfffff) rgba(7aa2f7ff) 45deg
    fail_color = rgba(f7768eff)
    capslock_color = rgba(e0af68ff)
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    fade_on_empty = false
    placeholder_text = <span foreground="##565f89">󰌾  Password</span>
    fail_text = <span foreground="##f7768e">Wrong password ($ATTEMPTS)</span>
    position = 0, -40
    halign = center
    valign = center
}

# Keyboard layout (switch with Alt+Shift)
label {
    monitor =
    text = 󰌌  $LAYOUT
    color = rgba(565f89ff)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 0, -100
    halign = center
    valign = center
}

# Now playing
label {
    monitor =
    text = cmd[update:2000] ~/.config/hypr/scripts/now-playing.sh
    color = rgba(9ece6aff)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 0, 50
    halign = center
    valign = bottom
}
