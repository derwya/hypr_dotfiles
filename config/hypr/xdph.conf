# xdg-desktop-portal-hyprland (screen sharing) config
# Restart after editing:  systemctl --user restart xdg-desktop-portal-hyprland

screencopy {
    # Let apps reuse the screen you just picked. Vesktop/Chromium open two portal
    # sessions per share (preview, then the real stream); without a restore token
    # the picker would pop up twice.
    allow_token_by_default = true

    # Fallback if a share starts but viewers get a black/frozen stream on NVIDIA:
    # hand frames over in shared memory instead of DMA-BUF (a bit more CPU).
    # force_shm = true
}
